<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fragment — Code Snippet Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==========================================
       Landing Page — Animated Hero
       ========================================== -->
  <div id="landing-page" class="landing-page">
    <!-- Background gradient overlay -->
    <div class="landing-bg-gradient"></div>

    <!-- Floating Elegant Shapes -->
    <div class="landing-shapes">
      <div class="elegant-shape shape-1">
        <div class="shape-inner"></div>
      </div>
      <div class="elegant-shape shape-2">
        <div class="shape-inner"></div>
      </div>
      <div class="elegant-shape shape-3">
        <div class="shape-inner"></div>
      </div>
      <div class="elegant-shape shape-4">
        <div class="shape-inner"></div>
      </div>
      <div class="elegant-shape shape-5">
        <div class="shape-inner"></div>
      </div>
    </div>

    <!-- Hero Content -->
    <div class="landing-content">
      <div class="landing-badge">
        <span class="badge-dot"></span>
        <span class="badge-text">Code Snippet Manager</span>
      </div>

      <h1 class="landing-title">
        <span class="title-line-1">Organize Your</span>
        <br>
        <span class="title-line-2">Code Fragments</span>
      </h1>

      <p class="landing-subtitle">
        A smart, local-first snippet library with multi-language syntax highlighting and lightning-fast search.
      </p>

      <button id="btn-start-app" class="landing-start-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        <span>Start Fragment</span>
        <svg class="start-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <div class="landing-version">v1.0.0 · Built with Electron</div>
    </div>

    <!-- Bottom fade gradient -->
    <div class="landing-fade-overlay"></div>
  </div>

  <!-- Custom Title Bar -->
  <div id="titlebar" class="app-hidden">
    <div class="titlebar-drag">
      <svg class="titlebar-logo" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
      <span class="titlebar-title">Fragment</span>
    </div>
    <div class="titlebar-controls">
      <button id="btn-minimize" class="titlebar-btn" aria-label="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="1.5" rx="0.75" fill="currentColor"/></svg>
      </button>
      <button id="btn-maximize" class="titlebar-btn" aria-label="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button id="btn-close" class="titlebar-btn titlebar-btn-close" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 12 12"><line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div id="app" class="app-hidden">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="search-container">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="Search snippets..." autocomplete="off">
        </div>
      </div>
      <div class="sidebar-filters">
        <button id="btn-all" class="filter-btn active" data-filter="all">All</button>
        <button id="btn-favorites" class="filter-btn" data-filter="favorites">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Starred
        </button>
      </div>
      <div class="tag-filters" id="tag-filters">
        <!-- dynamically populated -->
      </div>
      <div id="snippet-list" class="snippet-list">
        <!-- dynamically populated -->
      </div>
      <button id="btn-new-snippet" class="btn-new-snippet">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        New Snippet
      </button>
    </aside>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Empty State -->
      <div id="empty-state" class="empty-state">
        <div class="empty-state-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <h2>Welcome to Fragment</h2>
        <p>Your personal code snippet library.<br>Create your first snippet to get started.</p>
        <button id="btn-empty-new" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Create Snippet
        </button>
      </div>

      <!-- Editor View -->
      <div id="editor-view" class="editor-view hidden">
        <div class="editor-toolbar">
          <div class="editor-toolbar-left">
            <input type="text" id="snippet-title" class="snippet-title-input" placeholder="Untitled Snippet" spellcheck="false">
          </div>
          <div class="editor-toolbar-right">
            <button id="btn-favorite" class="toolbar-btn" title="Toggle star">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </button>
            <button id="btn-copy" class="toolbar-btn" title="Copy to clipboard">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button id="btn-export" class="toolbar-btn" title="Export snippet">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button id="btn-delete" class="toolbar-btn toolbar-btn-danger" title="Delete snippet">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </div>
        <div class="editor-meta">
          <div class="meta-group">
            <label for="snippet-language">Language</label>
            <select id="snippet-language">
              <option value="plaintext">Plain Text</option>
              <option value="javascript">JavaScript</option>
              <option value="typescript">TypeScript</option>
              <option value="python">Python</option>
              <option value="java">Java</option>
              <option value="c">C</option>
              <option value="cpp">C++</option>
              <option value="csharp">C#</option>
              <option value="go">Go</option>
              <option value="rust">Rust</option>
              <option value="ruby">Ruby</option>
              <option value="php">PHP</option>
              <option value="swift">Swift</option>
              <option value="kotlin">Kotlin</option>
              <option value="html">HTML</option>
              <option value="css">CSS</option>
              <option value="scss">SCSS</option>
              <option value="sql">SQL</option>
              <option value="bash">Bash</option>
              <option value="powershell">PowerShell</option>
              <option value="json">JSON</option>
              <option value="yaml">YAML</option>
              <option value="xml">XML</option>
              <option value="markdown">Markdown</option>
              <option value="dockerfile">Dockerfile</option>
              <option value="graphql">GraphQL</option>
              <option value="lua">Lua</option>
              <option value="r">R</option>
              <option value="dart">Dart</option>
              <option value="elixir">Elixir</option>
            </select>
          </div>
          <div class="meta-group">
            <label for="snippet-tags">Tags</label>
            <input type="text" id="snippet-tags" placeholder="e.g. utility, api, auth (comma separated)" spellcheck="false">
          </div>
          <div class="meta-group meta-info">
            <span id="snippet-date" class="snippet-date"></span>
          </div>
        </div>
        <div class="editor-body">
          <div class="code-editor-container">
            <div class="line-numbers" id="line-numbers"></div>
            <textarea id="code-editor" class="code-editor" placeholder="Paste or write your code here..." spellcheck="false"></textarea>
          </div>
          <div id="code-preview" class="code-preview hidden">
            <pre><code id="highlighted-code"></code></pre>
          </div>
        </div>
        <div class="editor-footer">
          <div class="footer-left">
            <button id="btn-toggle-preview" class="footer-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              Preview
            </button>
          </div>
          <div class="footer-right">
            <span id="char-count" class="char-count"></span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
